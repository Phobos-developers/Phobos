 ================================================================
 Phobos Vector 标签一览
 [SomeVectorType]
 Duration=N                   AE 持续时间 (帧)
 Next=AnotherVectorType       串联下一个 Vector (过期后自动切换)
 ================================================================

 --- 通用 ---
 Vector.TimeStep=1                 每 N 帧运动一次
 Vector.DisabledFrames=0           首帧快照后冻结 N 帧
 Vector.SyncFacing=yes             抛射体面朝运动方向 / 单位转动
 Vector.OriginIsOnWorld=no         yes=世界坐标系 FLH (朝北)
 Vector.OriginIsOnBody=no          yes=取车身 PrimaryFacing 无视炮塔
 Vector.Origin=Self                Self | Launcher | Target
 Vector.OriginFLH=0,0,0            Origin 偏移
 Vector.OriginNoUpdate=no          yes=锁定初始坐标不刷新
 Vector.Force=yes                  yes=SetLocation 硬控
 Vector.Freeze=no                  yes=冻结原地
 Vector.AllowedTilt=no             yes=允许坐标系倾斜

 --- NormalVector (圆法向量, FLH 坐标系) ---
 Vector.NormalVector=F,L,H          法向量 F/L/H 分量
 Vector.NormalRandomF.Min=0         F 分量随机下限
 Vector.NormalRandomF.Max=0         F 分量随机上限
 Vector.NormalRandomL.Min=0
 Vector.NormalRandomL.Max=0
 Vector.NormalRandomH.Min=0
 Vector.NormalRandomH.Max=0
 Vector.NormalFAnglePerStep=0       绕 F 轴角速度 (°/step)
 Vector.NormalLAnglePerStep=0
 Vector.NormalHAnglePerStep=0
 Vector.NormalFAngleRanges.Min=0    绕 F 轴角速度 4 值区间
 Vector.NormalFAngleRanges.Max=0
 Vector.NormalFAngleRanges.Min2=0
 Vector.NormalFAngleRanges.Max2=0
 (同理 .NormalLAngleRanges / .NormalHAngleRanges)

 --- MoveTo 模式 ---
 Vector.MoveTo=X,Y,Z               纯 FLH 位移 / step
 Vector.GrowRate=X,Y,Z             MoveTo 每帧增量
 Vector.AnglePerStep=0             MoveTo 自旋角度 (°/step)

 --- Circle 模式 ---
 Vector.CircleRadius=-1            半径 (-1=取当前 XY 距离)
 Vector.CircleSpeed=0              线速度
 Vector.CircleSpeedAcceleration=0  线速度加速度
 Vector.CircleMaxSpeed=0           线速度上限 (0=不限)
 Vector.CircleMinSpeed=0
 Vector.CircleAnglePerStep=0       角速度 (°/step)
 Vector.CircleAngleAcceleration=0  角速度加速度
 Vector.CircleMaxAngle=0           角速度上限 (0=不限)
 Vector.CircleMinAngle=0
 Vector.CircleOrigin=F,L,H         圆心偏移 (默认世界坐标, AllowOriginTilt 时 FLH 旋转)
 Vector.AllowOriginTilt=0          yes=圆心偏移跟随倾斜
 Vector.CircleRadiusGrow=0         半径每帧增长 (正=外扩)
 Vector.CircleMaxRadius=0          半径上限
 Vector.CircleMinRadius=0          半径下限
 Vector.CircleEndOnMaxRadius=no    到达上限时结束
 Vector.CircleEndOnMinRadius=no
 Vector.CircleRandomRadius.Min=0   随机半径范围
 Vector.CircleRandomRadius.Max=0
 Vector.CircleRandomAngle.Min=0    随机角速度范围
 Vector.CircleRandomAngle.Max=0

 --- Origin 圆心移动 (Circle 模式专用) ---
 Vector.Origin.MoveTo=F,L,H          圆心 FLH 位移
 Vector.Origin.GrowRate=F,L,H        每帧增量
 Vector.Origin.AnglePerStep=0        自旋角度
 Vector.Origin.TargetFLH=F,L,H       追踪目标 FLH
 Vector.Origin.InitialSpeed=-1       初始速度 (-1=读单位 Speed)
 Vector.Origin.Acceleration=0        加速度
 Vector.Origin.MaxSpeed=-1           (-1=不限)
 Vector.Origin.MinSpeed=-1
 Vector.Origin.ReachTarget=no        到达模式
 Vector.Origin.ArcHeight=0           到达模式弧高
 Vector.Origin.CircleRadius=-1
 Vector.Origin.CircleSpeed=0
 Vector.Origin.CircleAnglePerStep=0
 Vector.Origin.CircleRadiusGrow=0
 Vector.Origin.CircleMaxRadius=0
 Vector.Origin.CircleMinRadius=0
 Vector.Origin.CircleEndOnMaxRadius=no
 Vector.Origin.CircleEndOnMinRadius=no
 Vector.Origin.NormalVector=F,L,H     圆心法向量
 Vector.Origin.NormalFAnglePerStep=0
 Vector.Origin.NormalLAnglePerStep=0
 Vector.Origin.NormalHAnglePerStep=0
 Vector.Origin.AllowedTilt=no
 Vector.Origin.CircleOffset=X,Y,Z     原点世界偏移
 Vector.Origin.Origin=Self            参考系 Self|Launcher|Target|Source
 Vector.Origin.OriginFLH=F,L,H
 Vector.Origin .NormalFAngleRanges.Min/Min2 等同上

 --- Speed / ReachTarget 模式 ---
 Vector.TargetFLH=F,L,H            目标 FLH 偏移
 Vector.TargetOffsetF.Min=0        F 方向随机偏移范围
 Vector.TargetOffsetF.Max=0
 Vector.TargetOffsetL.Min=0
 Vector.TargetOffsetL.Max=0
 Vector.TargetOffsetH.Min=0
 Vector.TargetOffsetH.Max=0
 Vector.InitialSpeed=-1            初始速度 (-1=读单位 Speed)
 Vector.RandomSpeed.Min=0          随机速度范围
 Vector.RandomSpeed.Max=0
 Vector.MaxSpeed=-1                (-1=不限)
 Vector.MinSpeed=-1
 Vector.Acceleration=0             加速度 (每帧)
 Vector.ReachTarget=no             yes=剩余帧数强制到达
 Vector.ReachTargetEarlyEnd=0      提前 N 帧结束 (触发 Next)

 --- 弧高 (ReachTarget 模式) ---
 Vector.ArcHeight=0                弧高 (lepton), 0=直线
 Vector.ArcRandomHeight.Min=0      随机弧高范围
 Vector.ArcRandomHeight.Max=0
 Vector.ArcPeakPercent=50          弧顶 Duration 百分比 (0-100)
 Vector.ArcPeakRandomPercent=0     固定随机峰位
 Vector.ArcPeakRandomPercent.Min=0  随机峰位范围
 Vector.ArcPeakRandomPercent.Max=0
 Vector.ArcRotation=0              弧面旋转角 (°)
 Vector.ArcRandomRotation.Min=0
 Vector.ArcRandomRotation.Max=0

 --- 杂项 ---
 Vector.AllowFallingDestroy=no     结束时摔死
 Vector.FallingDestroyHeight=208   摔死高度阈值
 Vector.AffectTechno=yes
 Vector.AffectBullets=no
